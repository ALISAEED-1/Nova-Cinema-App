org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# This project lives on D: while the Dart pub cache is on C:. Kotlin's
# incremental compiler computes relative paths between plugin sources and the
# module root, which throws "different roots" on Windows when they sit on
# different drives and corrupts its caches. Full (non-incremental) compilation
# has no such issue.
kotlin.incremental=false
